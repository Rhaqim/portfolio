<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Menlo, monospace">
  <rect width="1200" height="630" fill="#08080a"/>

  <!-- Hairline grid: instrument panel, not decoration -->
  <g stroke="#1e1e23" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="545" x2="1200" y2="545"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
  </g>

  <!-- Red signal mark -->
  <rect x="80" y="72" width="14" height="14" fill="#e01b18"/>

  <!-- Identity -->
  <text x="118" y="86" font-size="20" font-weight="500" letter-spacing="6" fill="#e9e7e4">RHAQIM</text>
  <text x="1120" y="86" font-size="15" letter-spacing="3" fill="#6b6a72" text-anchor="end">SYSTEMS ENGINEER</text>

  <!-- Thesis -->
  <text x="118" y="255" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="70" font-weight="500" letter-spacing="-2.2" fill="#e9e7e4">I build infrastructure</text>
  <text x="118" y="335" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="70" font-weight="500" letter-spacing="-2.2" fill="#e9e7e4">other software runs on.</text>

  <!-- Underline accent under the second line -->
  <rect x="118" y="360" width="128" height="3" fill="#e01b18"/>

  <!-- Supporting line -->
  <text x="118" y="418" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="22" fill="#9b9aa1">Backend and systems engineering, moving toward embedded and hardware.</text>

  <!-- Datasheet strip -->
  <g font-size="15" letter-spacing="2.5">
    <text x="118" y="512" fill="#6b6a72">GO<tspan fill="#46454d"> · </tspan>RUST<tspan fill="#46454d"> · </tspan>PYTHON<tspan fill="#46454d"> · </tspan>TYPESCRIPT</text>
    <text x="1120" y="512" fill="#e01b18" text-anchor="end">BUCKT / USSDFRAMEWORK / LOOM</text>
  </g>

  <!-- Footer -->
  <text x="118" y="592" font-size="14" letter-spacing="3" fill="#46454d">RHAQIM.COM</text>

  <!-- Bottom signal bar -->
  <rect x="0" y="626" width="1200" height="4" fill="#e01b18"/>
</svg>
